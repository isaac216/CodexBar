# Fork-only workflow for isaac216/CodexBar; it is not part of any upstream pull request.
# Builds SOURCE_REF as an ad-hoc signed app (no notarization, no Sparkle updates, no desktop
# widget) and runs the upstream lint and test entry points against the same commit.
name: Fork build (Claude browser sign-in)

on:
  push:
    branches: [isaac/build-app]
  workflow_call:
    inputs:
      source_ref:
        description: Branch to build (fork-upstream-sync.yml passes its candidate branch)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch to build
        required: false
        default: isaac/claude-config-dir-login

permissions:
  contents: read

concurrency:
  group: fork-build-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REF: ${{ inputs.source_ref || 'isaac/claude-config-dir-login' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Install lint tools
        run: ./Scripts/install_lint_tools.sh swiftlint oxlint oxfmt typescript

      - name: Lint
        run: ./Scripts/lint.sh lint-linux

  test:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
          [[ "$(/usr/bin/xcodebuild -version)" == Xcode\ 27* ]]
          /usr/bin/xcodebuild -version
          swift --version
          git rev-parse HEAD

      - name: Check app locales and Swift formatting
        run: ./Scripts/lint.sh lint-macos

      - name: Swift Test
        if: ${{ !cancelled() }}
        timeout-minutes: 100
        run: |
          CODEXBAR_TEST_GROUP_SIZE=8 \
            CODEXBAR_TEST_SUITE_TIMEOUT=120 \
            CODEXBAR_TEST_RETRY_NON_TIMEOUT_FAILURES=0 \
            ./Scripts/test.sh --direct-workers 2

  package:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
          [[ "$(/usr/bin/xcodebuild -version)" == Xcode\ 27* ]]
          /usr/bin/xcodebuild -version
          swift --version

      - name: Package ad-hoc app without the widget extension
        env:
          CODEXBAR_SIGNING: adhoc
          CODEXBAR_SKIP_WIDGET: "1"
        run: ./Scripts/package_app.sh release

      - name: Describe, verify and zip the app
        run: |
          set -euo pipefail
          plist=CodexBar.app/Contents/Info.plist
          echo "version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          echo "CodexGitCommit: $(/usr/libexec/PlistBuddy -c 'Print :CodexGitCommit' "$plist")"
          echo "checkout HEAD: $(git rev-parse HEAD)"
          lipo -archs CodexBar.app/Contents/MacOS/CodexBar
          codesign -dv --verbose=4 CodexBar.app 2>&1
          codesign --verify --deep --strict --verbose=2 CodexBar.app
          ditto -c -k --sequesterRsrc --keepParent CodexBar.app CodexBar.zip
          git rev-parse HEAD > CodexBar.commit.txt
          shasum -a 256 CodexBar.zip | tee CodexBar.zip.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodexBar-app
          path: |
            CodexBar.zip
            CodexBar.zip.sha256
            CodexBar.commit.txt
          retention-days: 14
          if-no-files-found: error
